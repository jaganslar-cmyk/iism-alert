name: IISM snow-skiing 2027 watcher

on:
  schedule:
    # Baseline cadence (~every 2h after GitHub throttling). Detecting the winter
    # schedule *publication* isn't a "fills in minutes" event, so 2h is fine.
    # A tight cadence via cron-job.org -> repository_dispatch can be added for the
    # Oct–Dec window if desired.
    - cron: "0 */2 * * *"
  repository_dispatch:
    types: [poll]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run detection only, do not send"
        type: boolean
        default: true

permissions:
  contents: write   # commit state.json back only when the alert fires

concurrency:
  group: iism-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python watch.py --dry-run
          else
            python watch.py
          fi
      - name: Persist state only when the alert has fired
        if: always()
        run: |
          if grep -q '"notified": true' state.json; then
            if ! git diff --quiet -- state.json; then
              git config user.name "iism-watch-bot"
              git config user.email "bot@users.noreply.github.com"
              git add state.json
              git commit -m "state: snow-skiing schedule detected, alert fired"
              git push
            fi
          fi
